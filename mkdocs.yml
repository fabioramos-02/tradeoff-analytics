site_name: Estudo de Plataformas de Web Analytics — SETDIG
site_description: Estudo técnico de arquitetura para seleção de plataforma de Web Analytics do Governo do Estado de Mato Grosso do Sul
site_author: SETDIG — Secretaria-Executiva de Transformação Digital
site_url: https://fabioramos-02.github.io/tradeoff-analytics/

docs_dir: .
site_dir: ../_site_analytics

theme:
  name: material
  language: pt-BR

  logo: docs/assets/img/segov-logo.svg
  favicon: docs/assets/img/brasao-ms.svg
  font: false

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo escuro

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - docs/assets/css/segov.css

plugins:
  - same-dir
  - search:
      lang: pt

extra:
  generator: false
  social:
    - icon: material/web
      link: https://www.setdig.ms.gov.br/
      name: SETDIG

exclude_docs: |
  CLAUDE.md
  LICENSE
  requirements.txt
  mkdocs.yml
  .gitignore
  .github/
  .claude/
  site/
  _site_analytics/
  .venv/
  __pycache__/
  *.pyc
  anexos/historico/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables

  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji

nav:
  - Início: README.md

  - Estudo:
      - Contexto: docs/01-contexto.md
      - Requisitos: docs/02-requisitos.md
      - Critérios: docs/03-criterios.md
      - Panorama de mercado: docs/04-mercado.md
      - Matriz de decisão: docs/05-matriz.md
      - ADR-002 (vigente): docs/06-adr-002.md
      - Recomendação: docs/07-recomendacao.md
      - Roadmap: docs/08-roadmap.md
      - Referências: docs/99-referencias.md

  - Plataformas:
      - Matomo: plataformas/matomo.md
      - PostHog: plataformas/posthog.md
      - Plausible: plataformas/plausible.md
      - Umami: plataformas/umami.md

  - Comparativos:
      - Matomo × PostHog (complementaridade): comparativos/matomo-vs-posthog.md
      - On-premise gratuito (4 plataformas): comparativos/on-premise-gratis.md
      - Coexistência Matomo + PostHog no Xvia: comparativos/coexistencia-matomo-posthog.md

  - Anexos:
      - Matriz completa: anexos/matriz.md
      - Benchmark: anexos/benchmark.md
      - Glossário: anexos/glossario.md

  - Apresentações:
      - Estudo (Marp): apresentacoes/camada-complementar-posthog.md
